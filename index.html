<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reza Pamvngkas — A sarcastic little corner of the internet</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Permanent+Marker&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f6f6f4;--ink:#111;--grey:#d9d9d6;--dot:rgba(0,0,0,.16);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#121212;--ink:#f2f2ef;--grey:#2a2a2a;--dot:rgba(255,255,255,.14)}}
:root[data-theme="dark"]{--paper:#121212;--ink:#f2f2ef;--grey:#2a2a2a;--dot:rgba(255,255,255,.14)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Courier Prime','Courier New',monospace;font-size:17px;line-height:1.55;background-image:radial-gradient(var(--dot) 1.2px,transparent 1.4px);background-size:9px 9px}
h1,h2,h3{font-family:Bangers,Impact,sans-serif;font-weight:400;letter-spacing:.03em;line-height:1;margin:0}
.mk{font-family:'Permanent Marker','Comic Sans MS',cursive}
main{max-width:1120px;margin:0 auto;padding:28px 18px 80px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:30px;margin-bottom:30px}
.box{position:relative;padding:26px 26px 28px;isolation:isolate}
.box::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--paper);border:5px solid var(--ink);box-shadow:9px 9px 0 var(--ink);filter:url(#rough)}
.box.inv::before{background:var(--ink)}
.box.inv{color:var(--paper)}
.box.inv .note{border-color:var(--paper)}
.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}.s6{grid-column:span 6}
.t1{transform:rotate(-.6deg)}.t2{transform:rotate(.5deg)}.t3{transform:rotate(-.3deg)}
h2{font-size:clamp(34px,5vw,54px);margin-bottom:12px}
h3{font-size:28px;margin-bottom:4px}
p{margin:0 0 12px}
.note{font-family:'Permanent Marker',cursive;font-size:15px;border-top:3px dashed var(--ink);padding-top:10px;margin:16px 0 0;transform:rotate(-.8deg)}
.tag{display:inline-block;font-family:Bangers,sans-serif;font-size:20px;background:var(--ink);color:var(--paper);padding:2px 12px;transform:rotate(-2deg);margin-bottom:14px}
.inv .tag{background:var(--paper);color:var(--ink)}
.tag.corner{position:absolute;top:-16px;right:-12px;margin:0;z-index:3;transform:rotate(4deg);box-shadow:3px 3px 0 var(--grey)}
.hero>div:first-child{padding-top:6px}
.nowgrid{margin:0;gap:22px 40px;grid-template-columns:repeat(2,1fr)}
.box,.grid>*{min-width:0}
body{overflow-x:clip}
ul{margin:0;padding-left:20px}li{margin:4px 0}
/* hero */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;align-items:end;padding-bottom:0}
.portrait{position:relative;align-self:end;margin-bottom:-4px}
.ph{position:relative;max-width:400px;margin:0 auto;container-type:inline-size}
.portrait img{display:block;width:100%}
.hero h1{font-size:clamp(54px,10vw,118px);margin:6px 0 16px;text-shadow:4px 4px 0 var(--grey)}
.burst{position:absolute;left:50%;top:35%;width:88%;z-index:2;background:var(--paper);border:3px solid var(--ink);padding:1px 6px;font-family:'Permanent Marker',cursive;text-align:center;white-space:nowrap;line-height:1.35;font-size:11px;font-size:3.05cqw;transform:translate(-50%,-50%) rotate(-1.5deg);filter:url(#rough)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .portrait img,:root:not([data-theme="light"]) .eimg{filter:invert(1)}}
:root[data-theme="dark"] .portrait img,:root[data-theme="dark"] .eimg{filter:invert(1)}
.cap{font-family:'Permanent Marker',cursive;font-size:14px;text-align:center;padding:8px 0 14px}
.btns{display:flex;flex-wrap:wrap;gap:16px;margin-top:20px}
.btn{position:relative;font-family:Bangers,sans-serif;font-size:22px;letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:8px 20px;isolation:isolate;display:inline-block}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;border:4px solid var(--ink);background:var(--paper);box-shadow:5px 5px 0 var(--ink);filter:url(#rough);transition:transform .12s,box-shadow .12s}
.btn:hover::before,.btn:focus-visible::before{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink)}
.btn.solid{color:var(--paper)}.btn.solid::before{background:var(--ink)}
.inv .btn{color:var(--ink)}.inv .btn::before{border-color:var(--paper);box-shadow:5px 5px 0 var(--paper)}
a:focus-visible,.foot:focus-visible{outline:3px dashed var(--ink);outline-offset:4px}
/* projects */
.proj{border:4px solid var(--ink);padding:16px;background:var(--paper);filter:url(#rough);margin-top:6px}
.inv .proj{border-color:var(--paper);background:var(--ink)}
.status{font-family:'Permanent Marker',cursive;font-size:14px;margin-top:8px;display:inline-block;border:3px solid currentColor;padding:0 10px;transform:rotate(-2deg)}
/* experience */
.big{font-family:Bangers,sans-serif;font-size:clamp(90px,16vw,170px);line-height:.85;text-shadow:5px 5px 0 var(--grey)}
.meta{font-size:14px;opacity:.8;margin-bottom:10px}
.sk h3{font-size:24px;margin-top:14px;border-bottom:4px solid var(--ink);display:inline-block}
.chips{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:8px}
.chips span{border:3px solid var(--ink);padding:0 9px;font-size:14px;transform:rotate(calc(var(--r,0)*1deg))}
.chips span:nth-child(2n){--r:-1.2}.chips span:nth-child(3n){--r:1.3}
.cur p{margin:0 0 14px}.cur b{font-family:Bangers,sans-serif;font-size:24px;letter-spacing:.04em;font-weight:400;display:block}
.links a{color:inherit;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:3px}
a.lk{color:inherit;text-decoration:none;font-weight:700;padding:0 5px;margin-left:-5px}a.lk:hover,a.lk:focus-visible{background:var(--ink);color:var(--paper)}h3 a.lk{font-weight:inherit}a.lk.ext::after{content:" ↗"}
.btn.sm{font-size:18px;padding:4px 14px;margin-top:14px}
.big2{font-family:Bangers,sans-serif;font-size:clamp(30px,5vw,44px);line-height:1.05;margin:8px 0 14px}
/* footer */
.foot{text-align:center;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;padding:46px 20px}
.foot h2{font-size:clamp(40px,8vw,84px)}
.foot.hit{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-5px) rotate(-.5deg)}75%{transform:translateX(5px) rotate(.5deg)}}
.egg{position:fixed;inset:0;z-index:50;display:flex;justify-content:center;align-items:center;padding:max(14px,env(safe-area-inset-top,0px)) 14px max(14px,env(safe-area-inset-bottom,0px));overflow:hidden;visibility:hidden;background:transparent;transition:background .4s,visibility 0s .4s}
.egg.on{visibility:visible;background:color-mix(in srgb,var(--paper) 92%,transparent);transition:background .4s}
.egg .win{--ew:max(150px,min(320px,64vw,calc((100vh - 300px)/.69)));--ew:max(150px,min(320px,64vw,calc((100dvh - 300px)/.69)));width:min(460px,100%);display:flex;flex-direction:column;align-items:center}
.pk{width:100%;height:calc(var(--ew)*.69 + 10px);margin-bottom:-10px;overflow:hidden;display:flex;justify-content:center;align-items:flex-start;position:relative;z-index:1}
.egg .msg{position:relative;width:100%;padding:24px 26px 18px;text-align:center;isolation:isolate;transform:rotate(-1.2deg);opacity:0;transition:opacity .3s;z-index:2}
.egg.on .msg{opacity:1}
.egg .msg::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--paper);border:5px solid var(--ink);box-shadow:8px 8px 0 var(--ink);filter:url(#rough)}
.egg h2{font-size:clamp(32px,6vw,52px);margin:0}
.x{position:absolute;top:-12px;right:-12px;border:3px solid var(--ink);background:var(--ink);color:var(--paper);font-family:Bangers;font-size:20px;padding:0 10px;cursor:pointer}
.eimg{display:block;flex:none;width:var(--ew);height:auto;margin-left:12%;transform:translateY(105%);transition:transform 1.3s cubic-bezier(.2,.8,.2,1) .25s}
.egg.on .eimg{transform:none}
@media(max-width:780px){
 body{font-size:16px}.grid{gap:26px;grid-template-columns:1fr}.nowgrid{grid-template-columns:1fr;gap:16px}.tag.corner{right:-4px;top:-14px}.s2,.s3,.s4,.s6{grid-column:1}
 .hero{grid-template-columns:1fr}.portrait{order:-1}.t1,.t2,.t3{transform:none}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.eimg{transition:none}.foot.hit{animation:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="7"/></filter></svg>

<main id="app"><noscript><p>Situs ini butuh JavaScript untuk menampilkan konten.</p></noscript></main>

<!-- EASTER EGG (isi diisi dari content.json) -->
<div class="egg" id="egg" role="dialog" aria-label="Easter egg"><div class="win"></div></div>

<script>
/* Semua isi situs dibaca dari content.json — edit lewat /admin/ */
(function(){
var app=document.getElementById('app'),egg=document.getElementById('egg'),assets={};
var preview=/[?&]preview\b/.test(location.search);

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function br(s){return esc(s).replace(/\r?\n/g,'<br>')}
function url(u){u=String(u||'').trim();if(/^[a-z][a-z0-9+.-]*:/i.test(u)&&!/^(https?|mailto|tel):/i.test(u))return '';return u}
function img(p){return esc(assets[p]||p||'')}
function arr(a){return Array.isArray(a)?a:[]}
function ext(u,text,cls){u=url(u);return u?'<a class="lk ext" href="'+esc(u)+'" target="_blank" rel="noopener">'+text+'</a>':text}
function btn(text,href,solid,blank){href=url(href);if(!text||!href)return '';return '<a class="btn'+(solid?' solid':'')+'" href="'+esc(href)+'"'+(blank?' target="_blank" rel="noopener"':'')+'>'+esc(text)+'</a>'}
function ps(list,extra){return arr(list).filter(Boolean).map(function(t){return '<p'+(extra||'')+'>'+esc(t)+'</p>'}).join('')}
function ul(list){list=arr(list).filter(Boolean);return list.length?'<ul>'+list.map(function(t){return '<li>'+esc(t)+'</li>'}).join('')+'</ul>':''}
function fmtDate(iso){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||''),d=m?new Date(+m[1],+m[2]-1,+m[3]):new Date();return d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}
var TILT=['t3','t2','t1'];

function hero(c){var h=c.hero||{},cv=c.cv||{};
 return '<section class="grid" id="top"><div class="box s6 hero t1">'
 +(h.tag?'<span class="tag corner">'+esc(h.tag)+'</span>':'')
 +'<div style="padding-bottom:26px"><h1>'+br(h.name)+'</h1>'+ps(h.paragraphs)
 +(h.marker?'<p class="mk" style="font-size:19px;margin:0">'+esc(h.marker)+'</p>':'')
 +(h.location?'<p style="margin-top:12px;opacity:.85">'+esc(h.location)+'</p>':'')
 +'<div class="btns">'+btn(h.btn_text,h.btn_href,true)+btn(cv.text,cv.url,false,true)+'</div></div>'
 +'<div class="portrait"><div class="ph">'+(h.image?'<img src="'+img(h.image)+'" alt="'+esc(h.image_alt)+'">':'')
 +(h.burst?'<div class="burst">'+esc(h.burst)+'</div>':'')+'</div>'+(h.caption?'<div class="cap">'+esc(h.caption)+'</div>':'')+'</div></div></section>'}

function about(c){var a=c.about||{};
 return '<section class="grid" id="about"><div class="box s3 t2"><h2>'+esc(a.title)+'</h2>'+ps(a.paragraphs)+'</div>'
 +'<div class="box s3 inv t3">'+(a.facts_tag?'<span class="tag">'+esc(a.facts_tag)+'</span>':'')+ul(a.facts)+'</div></section>'}

function projects(c){var p=c.projects||{};
 return '<section class="grid" id="projects"><div class="box s6 t1"><h2>'+esc(p.title)+'</h2>'
 +(p.marker?'<p class="mk" style="font-size:18px">'+esc(p.marker)+'</p>':'')+(p.intro?'<p>'+esc(p.intro)+'</p>':'')
 +'<div class="grid" style="margin:18px 0 0;gap:22px">'
 +arr(p.items).map(function(i){return '<div class="proj s2"><h3>'+ext(i.url,esc(i.name))+'</h3><p>'+esc(i.desc)+'</p>'+(i.status?'<span class="status">'+esc(i.status)+'</span>':'')+'</div>'}).join('')
 +'</div>'+(p.note?'<p class="note">'+esc(p.note)+'</p>':'')+'</div></section>'}

function skills(c){var s=c.skills||{};
 return '<section class="grid" id="skills"><div class="box s4 sk t2"><h2>'+esc(s.title)+'</h2>'+(s.intro?'<p>'+esc(s.intro)+'</p>':'')
 +arr(s.groups).map(function(g){return '<h3>'+esc(g.name)+'</h3><div class="chips">'+arr(g.chips).map(function(x){return '<span>'+esc(x)+'</span>'}).join('')+'</div>'}).join('')
 +'</div><div class="box s2 inv t3" style="align-self:start">'+(s.super_tag?'<span class="tag">'+esc(s.super_tag)+'</span>':'')
 +(s.super_big?'<div class="big2">'+esc(s.super_big)+'</div>':'')+(s.super_text?'<p>'+esc(s.super_text)+'</p>':'')
 +(s.super_note?'<p class="note">'+esc(s.super_note)+'</p>':'')+'</div></section>'}

function experience(c){var e=c.experience||{};
 var out='<section class="grid" id="experience"><div class="box s6 t1"><h2>'+esc(e.title)+'</h2>'+(e.intro?'<p>'+esc(e.intro)+'</p>':'')+'</div>';
 if(e.stat_big)out+='<div class="box s2 inv t2" style="display:flex;flex-direction:column;justify-content:center"><div class="big">'+esc(e.stat_big)+'</div><p class="mk" style="font-size:18px;margin:0">'+esc(e.stat_text)+'</p></div>';
 arr(e.jobs).forEach(function(j,i){
  var orgs=arr(j.orgs).filter(function(o){return o&&o.name}).map(function(o){return ext(o.url,esc(o.name))}).join(' / ');
  var meta=orgs+(orgs&&j.period?' · ':'')+esc(j.period||'');
  var size=/^s[2346]$/.test(j.size)?j.size:'s3';
  out+='<div class="box '+size+' '+TILT[i%3]+'"><h3>'+esc(j.title)+'</h3>'+(meta?'<div class="meta">'+meta+'</div>':'')+ps(j.paragraphs)
   +(j.list_intro?'<p style="margin-bottom:4px">'+esc(j.list_intro)+'</p>':'')+ul(j.list)+(j.note?'<p class="note">'+esc(j.note)+'</p>':'')+'</div>'});
 return out+'</section>'}

function now(c){var n=c.now||{};
 return '<section class="grid" id="now"><div class="box s6 cur inv t3"><h2>'+esc(n.title)+'</h2><br><div class="grid nowgrid">'
 +arr(n.items).map(function(i){return '<p><b>'+esc(i.title)+'</b>'+esc(i.text)+'</p>'}).join('')+'</div>'
 +(n.show_updated?'<p class="note">Last updated: <span>'+esc(fmtDate(n.updated))+'</span></p>':'')+'</div></section>'}

function contact(c){var k=c.contact||{},cv=c.cv||{},mail=k.email?'mailto:'+k.email:'';
 return '<section class="grid" id="contact"><div class="box s6 links t2"><h2>'+esc(k.title)+'</h2>'+(k.intro?'<p>'+esc(k.intro)+'</p>':'')
 +'<div class="grid" style="margin:14px 0 0;gap:20px"><div class="s3"><h3>'+esc(k.social_title)+'</h3><ul>'
 +arr(k.socials).map(function(s){return '<li>'+ext(s.url,esc(s.label))+'</li>'}).join('')+'</ul></div>'
 +'<div class="s3"><h3>'+esc(k.email_title)+'</h3>'+(k.email?'<p><a class="lk" href="'+esc(mail)+'">'+esc(k.email)+'</a></p>':'')+'</div></div>'
 +(k.note?'<p class="note">'+esc(k.note)+'</p>':'')+'<div class="btns">'+btn(k.hire_text,mail,true)+btn(cv.text,cv.url,false,true)+'</div></div></section>'}

function footer(c){var f=c.footer||{};
 return '<section class="grid" style="margin-bottom:0"><div class="box s6 foot inv t1" id="foot" role="button" tabindex="0" aria-label="Footer"><h2>'+esc(f.title)+'</h2>'
 +(f.marker?'<p class="mk" style="font-size:22px;margin:14px 0 6px">'+esc(f.marker)+'</p>':'')+(f.text?'<p>'+esc(f.text)+'</p>':'')
 +(f.signature?'<p class="mk" style="margin:0">'+esc(f.signature)+'</p>':'')+'</div></section>'}

function eggHtml(c){var g=c.egg||{};
 return '<div class="pk">'+(g.image?'<img class="eimg" src="'+img(g.image)+'" alt="'+esc(g.alt)+'">':'')+'</div>'
 +'<div class="msg"><button class="x" id="x" aria-label="Close">X</button><h2>'+br(g.title)+'</h2>'
 +(g.line1?'<p class="mk" style="margin:12px 0 4px">'+esc(g.line1)+'</p>':'')+(g.line2?'<p class="mk" style="margin:0">'+esc(g.line2)+'</p>':'')+'</div>'}

function render(c){
 if(c.meta&&c.meta.title)document.title=c.meta.title;
 var d=document.querySelector('meta[name=description]');if(!d){d=document.createElement('meta');d.name='description';document.head.appendChild(d)}
 if(c.meta&&c.meta.description)d.content=c.meta.description;
 app.innerHTML=[hero,about,projects,skills,experience,now,contact,footer].map(function(f){return f(c)}).join('');
 egg.querySelector('.win').innerHTML=eggHtml(c)}

/* easter egg: klik footer 5x */
var n=0,t;
function hit(){var f=document.getElementById('foot');if(!f)return;n++;f.classList.remove('hit');void f.offsetWidth;f.classList.add('hit');clearTimeout(t);t=setTimeout(function(){n=0},2500);if(n>=5){egg.classList.add('on');n=0}}
function close(){egg.classList.remove('on')}
document.addEventListener('click',function(k){
 if(k.target.closest('#foot'))hit();
 if(k.target.closest('#x')||k.target===egg||k.target.classList.contains('win'))close()});
document.addEventListener('keydown',function(k){
 if(k.key==='Escape')close();
 if((k.key==='Enter'||k.key===' ')&&document.activeElement&&document.activeElement.id==='foot'){k.preventDefault();hit()}});

/* mode preview: dipakai oleh dashboard (/admin) */
if(preview){
 window.addEventListener('message',function(ev){
  if(ev.origin!==location.origin||!ev.data)return;
  if(ev.data.type==='content'){assets=ev.data.assets||{};render(ev.data.content)}
  if(ev.data.type==='scroll'){var el=document.getElementById(ev.data.id);if(el)el.scrollIntoView({block:'start'})}});
 if(window.parent!==window)window.parent.postMessage({type:'preview-ready'},location.origin);
}else{
 fetch('content.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(render)
 .catch(function(){app.innerHTML='<p style="padding:40px">Gagal memuat content.json. Kalau dibuka langsung dari file, jalankan lewat server lokal atau upload dulu ke hosting.</p>'});
}
})();
</script>
</body>
</html>
